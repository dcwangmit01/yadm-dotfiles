# window numbering
# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Mouse Mode (click to focus, drag borders, wheel for scrollback; shift-click to select text)
set-option -g mouse on

# True color: tmux-sensible sets screen-256color; layer 24-bit passthrough on top.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# emacs keys in copy-mode + pipe selection to macOS pasteboard
setw -g mode-keys emacs
set -g status-keys emacs
bind -T copy-mode M-w send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# New windows open in current pane's directory (splits/nav/resize come from tmux-pain-control)
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file
bind r source-file ~/.tmux.conf \; display "config reloaded"

# Window naming: auto-rename to cwd basename; `prefix ,` to rename manually,
# `prefix M-r` to restore auto-rename (R is taken by tmux-sensible reload).
set-window-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -g status-interval 1
bind , command-prompt -I "#W" {
  if -F "#{==:%%,}" {
    set-window-option -u automatic-rename
  } {
    rename-window -- "%%"
    set-window-option automatic-rename off
  }
}
bind M-r set-window-option -u automatic-rename \; display "auto-rename restored"

# Any rename to empty string (via prefix ,, right-click menu, :rename-window, etc.)
# restores auto-rename instead of leaving the window with a blank name.
set-hook -g after-rename-window 'if -F "#{==:#{window_name},}" "set-window-option -u automatic-rename"'


# set terminal title
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# 12-hour clock (am/pm) in the status bar and copy-mode position indicator
set -g status-right "#(/Users/dave/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%-l:%M%p %m/%d"
set -g status-right-length 50
set -g copy-mode-position-format "#[align=right]#{t/f/%-l#:%M%p:top_line_time}#{?#{e|>:#{top_line_time},0}, ,}[#{scroll_position}/#{history_size}]#{?search_timed_out, (timed out),#{?search_count, (#{search_count}#{?search_count_partial,+,} results),}}"

# Status bar background: solarized base02 (dark gray) so green/blue text stays readable
set-option -g status-style "fg=colour245,bg=colour235"

# Active pane: bright orange border + bold; inactive panes dim gray.
set-option -g pane-border-style "fg=colour238"
set-option -g pane-active-border-style "fg=colour208,bold"

# Dim inactive panes via background — inactive gets pure black (darker than default),
# active stays on terminal default so it reads as the "lit" pane.
set -g window-style 'bg=colour232'
set -g window-active-style 'bg=default'

# Per-pane label on top: ↓ N ↓ (orange, bold) on the active pane, dim N on others.
# Hook auto-toggles the label bar off in single-pane windows.
set-option -g pane-border-format "#{?pane_active,#[fg=colour208#,bold] ↓ #P ↓ ,#[fg=colour244]   #P   }"
set-hook -g window-layout-changed 'set-window-option -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# Status bar: window index + #W (name, auto-tracks cwd) + current running command.
set-window-option -g window-status-current-format "#[fg=red,bg=colour166,bold] #{window_index} #[fg=green]#W #[fg=cyan]#{?#{||:#{m:*sh,#{pane_current_command}},#{m/r:^[0-9]+\\.[0-9]+\\.[0-9]+$,#{pane_current_command}}},,#{pane_current_command} }#[fg=white]|"
set-window-option -g window-status-format "#[fg=white,bold]#{window_index} #[fg=green]#W #[fg=blue]#{?#{||:#{m:*sh,#{pane_current_command}},#{m/r:^[0-9]+\\.[0-9]+\\.[0-9]+$,#{pane_current_command}}},,#{pane_current_command} }#[fg=white]|"

# Claude-alert: Stop/Notification hooks in ~/.claude/settings.json override
# window-status-style on Claude's window to a red bg. Clear that override when
# the user selects the window.
set-hook -g after-select-window 'set-window-option -u window-status-style'


###############################################################################
# Plugins (tpm)

# Clone TPM if missing (must exist before @plugin declarations are useful)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'seebi/tmux-colors-solarized'

# Manual restore only — press `prefix + Ctrl-r` to restore last saved session.
# (tmux-continuum still auto-saves every 15 min in the background.)
set -g @continuum-restore 'off'

# Solarized variant: 256 | dark | light | base16
set -g @colors-solarized 'dark'

# Initialize tpm (must come before install_plugins so TMUX_PLUGIN_MANAGER_PATH is set)
run '~/.tmux/plugins/tpm/tpm'

# Install any declared plugins that aren't yet on disk (idempotent)
run '~/.tmux/plugins/tpm/bin/install_plugins'
